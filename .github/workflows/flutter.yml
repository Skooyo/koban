name: Flutter

on:
  push:
    paths:
      - 'koban/**'
  pull_request:
    paths:
      - 'koban/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: koban
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
