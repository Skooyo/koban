<!DOCTYPE html>
<!-- PROTOTYPE — throwaway. Question: how do the Claude fallback button, waiting state and messages look in the split bill Items step?
     Three layouts (?variant=A|B|C) x seven states (?state=...). Data is fake (Menya Hanabi read by the rules with prices shifted). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · Claude fallback</title>
<style>
  :root { --bg:#171c28; --surf:#1f2535; --surf2:#262d40; --line:#3a4256; --ink:#e6e9f2; --mut:#9aa3b8; --pri:#7aa2f7; --onpri:#0d1b3d; --err:#f28b82; --ok:#81c995; --warn:#fdd663; }
  * { box-sizing:border-box; }
  body { margin:0; background:#0e111a; font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif; color:var(--ink); display:flex; justify-content:center; padding:24px 0 120px; }
  .phone { width:400px; min-height:820px; background:var(--bg); border-radius:28px; border:1px solid #2a3145; overflow:hidden; position:relative; display:flex; flex-direction:column; }
  .top { display:flex; align-items:center; gap:16px; padding:18px 20px 6px; font-size:22px; font-weight:700; }
  .scroll { flex:1; padding:6px 20px 90px; overflow:auto; }
  h1 { font-size:26px; margin:6px 0 4px; }
  .mut { color:var(--mut); } .err { color:var(--err); } .ok { color:var(--ok); }
  .field { border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin:10px 0; display:flex; justify-content:space-between; }
  .field small { color:var(--mut); display:block; font-size:12px; }
  .item { border:1px solid var(--line); border-radius:6px; padding:8px 12px; margin:8px 0; display:flex; justify-content:space-between; gap:8px; }
  .item.changed { border-color:var(--ok); background:rgba(129,201,149,.07); }
  .item .q { color:var(--mut); margin-right:6px; }
  .row { display:flex; justify-content:space-between; margin:6px 0; }
  .total { font-size:20px; font-weight:700; }
  hr { border:0; border-top:1px solid var(--line); margin:14px 0 8px; }
  .btn { display:block; width:100%; text-align:center; padding:11px; border-radius:22px; font-weight:600; border:1px solid var(--line); background:transparent; color:var(--pri); margin-top:8px; cursor:pointer; font:inherit; }
  .btn.fill { background:var(--pri); color:var(--onpri); border-color:var(--pri); }
  .btn.text { border-color:transparent; }
  .next { position:absolute; left:0; right:0; bottom:0; background:var(--surf); padding:12px 20px; }
  .card { background:var(--surf2); border-radius:14px; padding:14px; margin:10px 0; }
  .card.warn { border-left:4px solid var(--err); }
  .card.good { border-left:4px solid var(--ok); }
  .chip { display:inline-block; font-size:12px; padding:2px 8px; border-radius:10px; background:#2f3850; color:var(--mut); }
  .spin { width:18px; height:18px; border:3px solid #3b4870; border-top-color:var(--pri); border-radius:50%; display:inline-block; animation:s 1s linear infinite; vertical-align:middle; margin-right:8px; }
  @keyframes s { to { transform:rotate(360deg); } }
  .bar { height:4px; background:#2f3850; border-radius:2px; overflow:hidden; margin-top:10px; }
  .bar i { display:block; height:100%; width:35%; background:var(--pri); animation:b 1.6s ease-in-out infinite; }
  @keyframes b { 0% { margin-left:-35%; } 100% { margin-left:100%; } }
  .skel { height:40px; border-radius:6px; margin:8px 0; background:linear-gradient(90deg,#222a3c 25%,#2c3550 50%,#222a3c 75%); background-size:200% 100%; animation:sk 1.4s infinite; }
  @keyframes sk { to { background-position:-200% 0; } }
  .scrim { position:absolute; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; }
  .sheet { background:var(--surf); width:100%; border-radius:20px 20px 0 0; padding:18px 20px 22px; max-height:88%; overflow:auto; }
  .grab { width:36px; height:4px; background:#4a5470; border-radius:2px; margin:0 auto 12px; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:13px; }
  .cols .h { font-weight:700; margin-bottom:4px; }
  .cols div div { padding:3px 0; border-bottom:1px dashed #333b52; display:flex; justify-content:space-between; gap:4px; }
  .bad { color:var(--err); }
  /* prototype switcher — not part of the design */
  .sw { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#fff; color:#111; border-radius:999px; box-shadow:0 6px 24px rgba(0,0,0,.5); padding:6px 10px; display:flex; gap:6px; align-items:center; font:13px system-ui; z-index:9; flex-wrap:wrap; justify-content:center; max-width:96vw; }
  .sw button { border:0; background:#eee; border-radius:999px; padding:5px 10px; cursor:pointer; font:inherit; }
  .sw button.on { background:#111; color:#fff; }
  .sw b { padding:0 6px; }
  .sep { width:1px; height:20px; background:#ccc; margin:0 4px; }
</style>
</head>
<body>
<div class="phone" id="phone"></div>
<div class="sw" id="sw"></div>
<script>
const VARIANTS = { A: "Under the totals (where the warning is today)", B: "Card at the top of the list", C: "Bottom sheet that compares both reads" };
const STATES = { idle:"Mismatch", wait:"Waiting", done:"Read OK", e401:"No access", e429:"Limit", e503:"Busy", e502:"Could not read" };
const p = new URLSearchParams(location.search);
let v = VARIANTS[p.get("variant")] ? p.get("variant") : "A";
let st = STATES[p.get("state")] ? p.get("state") : "idle";

const rulesItems = [["Qty Item",1,"26.00"],["Kimisla (Large) {26.00/ea)",1,"24.00"],["Kimista (Smal) (24.00/ea)",1,"35.00"],["(35 03/ea)",1,"34.00"],["(34.00/ea)",1,"5.50"],["Korokke (5.50/ea)",1,"3.00"]];
const claudeItems = [["Kimista (Large)",1,"26.00"],["Kimista (Small)",1,"24.00"],["Nagoya Mazesoba DX (Large)",1,"35.00"],["Doniku Nagoya Mazesoba (Large)",1,"34.00"],["Korokke",1,"5.50"],["Ajitama",1,"3.00"]];
const done = st === "done";
const items = done ? claudeItems : rulesItems;
const sum = done ? "135.15" : "135.15"; // rules read: 127.50 items + 7.65? shown below as wrong total
const itemsHtml = (list, mark) => list.map(([n,q,pr]) => `<div class="item ${mark?'changed':''}"><span><span class="q">${q}×</span>${n}</span><span>RM ${pr}</span></div>`).join("");
const skel = () => '<div class="skel"></div>'.repeat(6);

const MSG = {
  e401: { t:"Claude reading needs online access.", d:"Enter your invite code in Settings, then try again.", b:"Open Settings" },
  e429: { t:"You used your 10 Claude reads for today.", d:"Try again tomorrow, or edit the items below.", b:null },
  e503: { t:"The reader is busy.", d:"Try again in 1 minute.", b:"Try again" },
  e502: { t:"Claude could not read this receipt.", d:"Edit the items below, or take a clearer photo. This used 1 of today's reads.", b:"Take another photo" },
};

function header(extra="") {
  return `<div class="top">← <span>Split a bill</span></div><div class="scroll"><h1>Items</h1>${extra}
  <div class="field"><span><small>Place</small>MENYA HANABI</span></div>`;
}
function charges() {
  return `<div class="field"><span><small>Service charge (RM)</small>0.00</span></div>
  <div class="field"><span><small>SST (RM)</small>7.65</span></div>`;
}
function totals(mismatch) {
  return `<hr><div class="row total"><span>Total</span><span>RM ${mismatch ? "135.15" : "135.15"}</span></div>
  <div class="row mut"><span>Receipt total</span><span>RM ${mismatch ? "7.65" : "135.15"}</span></div>`;
}
const foot = `<div class="next"><button class="btn fill">Next</button></div>`;

function A() {
  let warn = "";
  if (st === "idle") warn = `<p class="err">The items and charges differ from the receipt total by RM 127.50.</p>
    <button class="btn fill">✨ Read with Claude</button><div class="mut" style="font-size:13px;margin-top:6px;text-align:center">Sends the photo to Koban's server · 7 reads left today</div>
    <button class="btn">Add RM -127.50 as rounding</button>`;
  if (st === "wait") warn = `<p class="err">The items and charges differ from the receipt total by RM 127.50.</p>
    <div class="card"><span class="spin"></span>Claude is reading the receipt… <span class="mut">(about 10 s)</span><div class="bar"><i></i></div><button class="btn text">Cancel</button></div>`;
  if (MSG[st]) { const m = MSG[st]; warn = `<p class="err">The items and charges differ from the receipt total by RM 127.50.</p>
    <div class="card warn"><b>${m.t}</b><div class="mut">${m.d}</div>${m.b ? `<button class="btn">${m.b}</button>` : ""}</div>
    <button class="btn">Add RM -127.50 as rounding</button>`; }
  const top = done ? `<p class="ok">✓ Read by Claude. Matches the receipt total of RM 135.15. <span class="mut">6 reads left today.</span> <a style="color:var(--pri)">Undo</a></p>` : "";
  return header(top) + itemsHtml(items, done) + `<button class="btn">Add item</button><h3>Charges</h3>` + charges() + totals(!done) + warn + `</div>` + foot;
}

function B() {
  let card = "";
  if (st === "idle") card = `<div class="card warn"><b>These items do not add up.</b><div class="mut">They differ from the receipt total by RM 127.50.</div>
     <div style="display:flex;gap:8px;margin-top:6px"><button class="btn fill">✨ Read with Claude</button><button class="btn">Fix by hand</button></div>
     <div style="margin-top:8px"><span class="chip">7 Claude reads left today</span></div></div>`;
  if (st === "wait") card = `<div class="card"><span class="spin"></span><b>Claude is reading the receipt</b><div class="mut">Usually 5–20 seconds. You can wait here.</div><button class="btn text">Cancel</button></div>`;
  if (done) card = `<div class="card good"><b class="ok">✓ Read by Claude</b><div class="mut">Matches the receipt total of RM 135.15. 6 items changed (green).</div>
     <div style="display:flex;gap:8px;margin-top:6px"><button class="btn">Undo</button></div><div style="margin-top:8px"><span class="chip">6 Claude reads left today</span></div></div>`;
  if (MSG[st]) { const m = MSG[st]; card = `<div class="card warn"><b>${m.t}</b><div class="mut">${m.d}</div>${m.b ? `<button class="btn fill">${m.b}</button>` : ""}<button class="btn">Fix by hand</button></div>`; }
  const list = st === "wait" ? skel() : itemsHtml(items, done);
  return header(card) + list + `<button class="btn">Add item</button><h3>Charges</h3>` + charges() + totals(!done) + `</div>` + foot;
}

function C() {
  const base = header(`<p class="err" style="margin:4px 0">Differs from the receipt total by RM 127.50. <a style="color:var(--pri)">${done ? "" : "Fix"}</a></p>`) +
    itemsHtml(done ? claudeItems : rulesItems, done) + `<button class="btn">Add item</button><h3>Charges</h3>` + charges() + totals(!done) + `</div>` + foot;
  if (done) return base.replace('<p class="err" style="margin:4px 0">Differs from the receipt total by RM 127.50. <a style="color:var(--pri)"></a></p>', '<p class="ok">✓ Using Claude\'s read · 6 reads left today</p>');
  let sheet = "";
  if (st === "idle") sheet = `<b style="font-size:18px">Fix the items</b><p class="mut">The phone's read does not add up to the receipt total.</p>
     <button class="btn fill">✨ Read again with Claude</button><div class="mut" style="font-size:13px;text-align:center;margin-top:4px">Sends the photo to Koban's server · 7 reads left today</div>
     <button class="btn">Add RM -127.50 as rounding</button><button class="btn text">Edit by hand</button>`;
  if (st === "wait") sheet = `<b style="font-size:18px">Claude is reading…</b><div class="cols" style="margin-top:12px"><div><div class="h">Phone read</div>${rulesItems.map(([n,q,p])=>`<div><span>${n.slice(0,14)}</span><span class="bad">${p}</span></div>`).join("")}</div><div><div class="h">Claude read</div>${'<div class="skel" style="height:18px;margin:6px 0"></div>'.repeat(6)}</div></div><button class="btn text">Cancel</button>`;
  if (MSG[st]) { const m = MSG[st]; sheet = `<b style="font-size:18px">${m.t}</b><p class="mut">${m.d}</p>${m.b ? `<button class="btn fill">${m.b}</button>` : ""}<button class="btn text">Edit by hand</button>`; }
  // in C, "done" is a compare step before applying — shown via state=idle→wait→compare; we reuse 'done' as the applied list above
  return base + `<div class="scrim"><div class="sheet"><div class="grab"></div>${sheet}</div></div>`;
}

function render() {
  document.getElementById("phone").innerHTML = ({A,B,C})[v]();
  const sw = document.getElementById("sw");
  sw.innerHTML = `<button id="pv">←</button><b>${v} — ${VARIANTS[v]}</b><button id="nv">→</button><span class="sep"></span>` +
    Object.entries(STATES).map(([k,t]) => `<button data-s="${k}" class="${k===st?'on':''}">${t}</button>`).join("");
  sw.querySelector("#pv").onclick = () => go(-1); sw.querySelector("#nv").onclick = () => go(1);
  sw.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { st = b.dataset.s; push(); });
}
function go(d) { const k = Object.keys(VARIANTS); v = k[(k.indexOf(v)+d+k.length)%k.length]; push(); }
function push() { history.replaceState(null,"",`?variant=${v}&state=${st}`); location.reload(); }
document.addEventListener("keydown", e => { if (e.key==="ArrowLeft") go(-1); if (e.key==="ArrowRight") go(1); });
render();
</script>
</body>
</html>
